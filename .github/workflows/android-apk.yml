name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Offline-First Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install dependencies
        run: npm ci

      - name: Generate mobile icons & splash assets
        run: npm run cap:assets

      - name: Build web bundle & sync Capacitor Android
        run: npm run cap:sync

      - name: Compile Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare named APK file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk koshaaru-v1.0.2.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: koshaaru-v1.0.2-apk
          path: koshaaru-v1.0.2.apk
          if-no-files-found: error
          retention-days: 30
